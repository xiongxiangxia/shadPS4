name: DmC compatibility and root-cause diagnostics

on:
  push:
    branches: [padtrace-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padtrace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.edition }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ROOTCAUSE-diagnostic
            compatibility: 'OFF'
          - edition: COMPAT-experimental
            compatibility: 'ON'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Initialize MSVC environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      - name: Configure release executable
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DENABLE_PADTRACE=ON -DENABLE_DMC_CHARGE_COMPAT=${{ matrix.compatibility }}
      - name: Build executable
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item build\shadPS4.exe package\shadPS4.exe
          Copy-Item documents\DMC-editions.md package\READ-ME-FIRST.md
          if ('${{ matrix.compatibility }}' -eq 'ON') {
            Copy-Item documents\DMC-JC-capture.md package\JC-CAPTURE.md
            Copy-Item tools\dmc-compat-on.cmd package\
            Copy-Item tools\dmc-compat-off.cmd package\
          } else {
            Copy-Item documents\PADTRACE-v2.md package\PADTRACE-v2.md
            Copy-Item tools\padtrace_summary.py package\padtrace_summary.py
          }
          '${{ matrix.edition }} / ${{ github.sha }}' | Out-File package\EDITION.txt
          Get-FileHash package\shadPS4.exe -Algorithm SHA256 | Format-List | Out-File package\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: shadPS4-DMC-${{ matrix.edition }}-windows-${{ github.sha }}
          path: package/
