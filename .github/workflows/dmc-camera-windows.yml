name: DmC dbb1bba7 charge compatibility with camera 2.5x

on:
  push:
    branches: [dmc-camera-2p5x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmc-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows COMPAT camera 2.5x
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Initialize MSVC environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      - name: Configure release executable
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DENABLE_PADTRACE=ON -DENABLE_DMC_CHARGE_COMPAT=ON -DENABLE_DMC_CAMERA_SPEED=ON
      - name: Build executable
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item build\shadPS4.exe package\shadPS4.exe
          Copy-Item documents\DMC-CAMERA.md package\READ-ME-FIRST.md
          Copy-Item tools\dmc-camera-default.cmd package\
          Copy-Item tools\dmc-camera-2p5x.cmd package\
          'COMPAT-CAMERA-2.5x / ${{ github.sha }} / base=dbb1bba7a1692420e6e7d3bff2a0e9f66937d797' | Out-File package\EDITION.txt
          Get-FileHash package\shadPS4.exe -Algorithm SHA256 | Format-List | Out-File package\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: shadPS4-DMC-COMPAT-CAMERA-2.5x-windows-${{ github.sha }}
          path: package/
