name: DmC pure play - charge compatibility and camera

on:
  push:
    branches: [dmc-play]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmc-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PLAY camera ${{ matrix.label }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 3x
            multiplier: '3.0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Initialize MSVC environment
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      - name: Configure play executable
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DENABLE_DMC_PLAY=ON "-DDMC_CAMERA_MULTIPLIER=${{ matrix.multiplier }}"
      - name: Compile play module first
        run: cmake --build build --target CMakeFiles/shadps4.dir/src/input/dmc_play.cpp.obj
      - name: Build executable
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
      - name: Package play executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item build\shadPS4.exe package\shadPS4.exe
          Copy-Item documents\DMC-PLAY.md package\READ-ME-FIRST.md
          'PLAY / camera=${{ matrix.label }} / ${{ github.sha }} / charge-base=dbb1bba7a1692420e6e7d3bff2a0e9f66937d797' | Out-File package\EDITION.txt
          Get-FileHash package\shadPS4.exe -Algorithm SHA256 | Format-List | Out-File package\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: shadPS4-DMC-PLAY-CAMERA-${{ matrix.label }}-windows-${{ github.sha }}
          path: package/
